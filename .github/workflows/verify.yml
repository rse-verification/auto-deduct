name: Verify AutoDeduct

on:
  pull_request:
    paths:
      - "Dockerfiles/**"
      - "bin/**"
      - "examples/ase-2024/**"
      - "tests/**"
      - ".github/workflows/verify.yml"
  push:
    paths:
      - "Dockerfiles/**"
      - "bin/**"
      - "examples/ase-2024/**"
      - "tests/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-autodeduct-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  ase-2024-integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfiles/AutoDeductDockerfile
          load: true
          tags: auto-deduct:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the public ASE 2024 end-to-end regression
        env:
          AUTODEDUCT_RUN_INTEGRATION: "1"
          AUTODEDUCT_IMAGE: auto-deduct:ci
        run: python -m unittest discover -s tests -p "test_ase_2024_integration.py" -v
