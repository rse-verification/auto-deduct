name: Verify AutoDeduct

on:
  pull_request:
    paths:
      - "Dockerfiles/**"
      - "bin/**"
      - "examples/ase-2024/**"
      - "examples/acta/**"
      - "tests/**"
      - ".github/workflows/verify.yml"
  push:
    branches:
      - main
    paths:
      - "Dockerfiles/**"
      - "bin/**"
      - "examples/ase-2024/**"
      - "examples/acta/**"
      - "tests/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-autodeduct-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  public-regression-matrix:
    name: Public regression matrix
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AUTODEDUCT_RUN_INTEGRATION: "1"
      AUTODEDUCT_IMAGE: auto-deduct:ci
      ACTA_TOKEN_AVAILABLE: ${{ secrets.ACTA_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfiles/AutoDeductDockerfile
          load: true
          tags: auto-deduct:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run ASE 2024 smoke regression
        run: python -m unittest discover -s tests -p "test_ase_2024_integration.py" -v
      - name: Run supported microtests
        run: python -m unittest discover -s tests -p "test_public_microtests_integration.py" -v
      - name: Run verified-warning microtests
        run: python -m unittest discover -s tests -p "test_expected_warning_integration.py" -v
      - name: Run expected-limitation microtests
        run: python -m unittest discover -s tests -p "test_expected_limitation_integration.py" -v
      - name: Run expected-incomplete-WP microtests
        run: python -m unittest discover -s tests -p "test_expected_incomplete_wp_integration.py" -v
      - name: Run host LOGOS integration against the standard image
        env:
          AUTODEDUCT_RUN_LOGOS_DOCKER: "1"
        run: python -m unittest discover -s tests -p "test_logos_integration.py" -v
      - name: Build optional AcTa verifier image
        if: env.ACTA_TOKEN_AVAILABLE == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfiles/AutoDeductDockerfile
          target: auto-deduct-acta-runtime
          load: true
          tags: auto-deduct:acta-ci
          cache-from: type=gha
          secrets: |
            github_token=${{ secrets.ACTA_GITHUB_TOKEN }}
      - name: Run host AcTa and CBMC integration
        if: env.ACTA_TOKEN_AVAILABLE == 'true'
        env:
          AUTODEDUCT_RUN_ACTA_DOCKER: "1"
          AUTODEDUCT_IMAGE: auto-deduct:acta-ci
        run: python -m unittest discover -s tests -p "test_acta_integration.py" -v
      - name: Run local AcTa workflow inside the verifier image
        if: env.ACTA_TOKEN_AVAILABLE == 'true'
        run: >-
          docker run --rm --network none
          -v "$PWD:/work:ro" -w /work
          -e AUTODEDUCT_RUN_ACTA_LOCAL=1
          auto-deduct:acta-ci
          python3 -m unittest discover -s tests -p test_acta_integration.py -v
